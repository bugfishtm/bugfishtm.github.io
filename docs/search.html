<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugfish - Projects</title>
  <!-- The standalone search page has been removed. Search now lives on
       the projects page. This stub only keeps old links and bookmarks
       (and the ?q= deep link) alive — GitHub Pages cannot send a 301,
       so a meta refresh plus a canonical to the projects page is used. -->
  <meta http-equiv="refresh" content="0; url=projects.html">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="canonical" href="https://bugfishtm.github.io/projects.html">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-base="">

  <main>
    <div class="error-wrap">
      <div class="error-msg">// SEARCH MOVED TO THE PROJECTS PAGE - REDIRECTING</div>
      <a class="btn" href="projects.html">Continue</a>
    </div>
  </main>

  <script>
    // Carry any ?q= term across to the projects page.
    var q = new URLSearchParams(location.search).get("q");
    location.replace("projects.html" + (q ? "?q=" + encodeURIComponent(q) : ""));
  </script>
</body>
</html>
