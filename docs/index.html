    <section id="hero">
      <canvas id="matrix-canvas"></canvas>
      <div class="hero-fade"></div>
      <div class="hero-inner">
        <div class="hero-left">
          <div class="hero-eyebrow">// SYSTEM IDENTIFIED</div>
          <h1 class="glitch" data-text="BUGFISH">BUGFISH</h1>

        </div>
        <div class="hero-right">
          <div class="terminal-window" id="nightfall-terminal">
            <div class="term-titlebar">
              <div class="term-dots">
                <span class="term-dot close"></span>
                <span class="term-dot min"></span>
                <span class="term-dot max"></span>
              </div>
              <span class="term-title-text">nightfall.sh</span>
              <span class="term-clock" id="term-clock">--:--:--</span>
            </div>
            <div class="term-hud">
              <span class="term-hud-item">NODE&nbsp;<b id="hud-node">localhost</b></span>
              <span class="term-hud-item">TRACE&nbsp;<b class="hud-trace" id="hud-trace">0%</b></span>
              <span class="term-hud-item hud-status alive" id="hud-status">● ONLINE</span>
            </div>
            <div class="term-body">
              <div id="game-output" class="game-output"></div>
              <div class="game-input-line">
                <span class="game-prompt">&gt;&nbsp;</span>
                <input type="text" id="game-input" class="game-input"
                       autocomplete="off" spellcheck="false" placeholder="type 'help'"
                       aria-label="Game command input">
              </div>
            </div>
          </div>
        </div>
      </div>
